# Demo room for the on-demand pipeline: build it with   python data/scenes/build_scene.py
#
# Frame: glTF (right-handed, +Y up, metres). The XR origin of the Unity scene stands at (0, 0, 0) and looks
# towards +Z, so z is "how far in front". Unity mirrors the X axis (as glTFast does for every .glb): an object
# at x = +1 here appears at x = -1 in the Unity Inspector, i.e. on the left.
#
# Per object:
#   id             unique name (also the name of the GameObject in Unity)
#   shape          any shape known to data/inputs/generate_pointclouds.py (--list shows them)
#   position       metres; with on_floor (default true) y is the floor height under the object
#   rotation_y_deg rotation around the vertical axis (or rotation_deg: [x, y, z])
#   size           longest side of the object, in metres
#   points         optional, overrides points_per_object

name: demo_room
points_per_object: 2048
reference_points: 20000
seed: 0

objects:
# The six objects stand in a circle around the player (one every 60 degrees, about 2.2 m away, each turned towards the
# centre): turning around, one object at a time enters the view. The box, the fastest to reconstruct (MeshAnything V2
# on the GT 1030: ~70 s), is the one in front, at table height (y = 0.8), so it is the first one asked for.
  - id: box_01                 # 0 degrees: in front
    shape: box
    position: [0.0, 0.8, 1.8]
    rotation_y_deg: 20
    size: 0.8

  - id: bunny_01               # 60 degrees
    shape: bunny
    position: [1.9, 0.0, 1.1]
    rotation_y_deg: 240
    size: 0.5

  - id: cat_01                 # 120 degrees
    shape: tmg_cat
    position: [1.9, 0.0, -1.1]
    rotation_y_deg: 300
    size: 0.6

  - id: puppet_01              # 180 degrees: behind
    shape: fastmesh_001
    position: [0.0, 0.0, -2.2]
    rotation_y_deg: 0
    size: 0.7

  - id: sphere_01              # 240 degrees
    shape: sphere
    position: [-1.9, 0.0, -1.1]
    size: 0.5

  - id: wand_01                # 300 degrees
    shape: mav2_wand
    position: [-1.9, 0.0, 1.1]
    rotation_y_deg: 30
    size: 1.0
